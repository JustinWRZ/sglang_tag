[package]
name = "sglang-h3-native"
version = "0.3.1"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "Rust core for SGLang MiniMax-H3 compatibility plugins"
readme = "README.md"

[lib]
name = "sglang_h3_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = ">=0.23,<0.24", features = ["extension-module", "abi3-py311"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
