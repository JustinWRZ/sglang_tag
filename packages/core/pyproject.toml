[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang-h3-compat-core"
version = "0.3.1"
description = "Shared MiniMax-H3 compatibility hooks for SGLang Diffusion"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "sglang-h3-native==0.3.1",
  "sglang[diffusion]==0.5.22",
  "torch",
  "safetensors",
]

[project.scripts]
h3-compat-doctor = "sglang_h3_compat.doctor:main"

[tool.setuptools.packages.find]
include = ["sglang_h3_compat*"]
